<line x1="350.0" y1="914.5" x2="634" y2="268.5" stroke="#1a56b0" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="350.0" y1="1018.5" x2="634" y2="567.5" stroke="#1a56b0" stroke-width="1.8" marker-end="url(#ar)"/>
