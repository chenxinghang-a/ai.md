<svg xmlns="http://www.w3.org/2000/svg" width="1076" height="1174.5" font-family="'Microsoft YaHei','SimSun',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 z" fill="#1a56b0"/></marker><marker id="av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 z" fill="#555"/></marker></defs>
<text x="200" y="26" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">流程图</text>
<text x="850.0" y="26" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">程序代码</text>
<line x1="200.0" y1="98.0" x2="200.0" y2="471.5" stroke="#555" stroke-width="2" marker-end="url(#av)"/>
<line x1="200.0" y1="525.5" x2="200.0" y2="575.5" stroke="#555" stroke-width="2" marker-end="url(#av)"/>
<line x1="200.0" y1="629.5" x2="200.0" y2="679.5" stroke="#555" stroke-width="2" marker-end="url(#av)"/>
<line x1="200.0" y1="733.5" x2="200.0" y2="762.5" stroke="#555" stroke-width="2" marker-end="url(#av)"/>
<line x1="200.0" y1="858.5" x2="200.0" y2="887.5" stroke="#555" stroke-width="2" marker-end="url(#av)"/>
<rect x="204.0" y="862.0" width="24" height="18" fill="#fff"/>
<text x="216.0" y="875.0" font-size="14" fill="#b00" text-anchor="middle">否</text>
<line x1="200.0" y1="941.5" x2="200.0" y2="991.5" stroke="#555" stroke-width="2" marker-end="url(#av)"/>
<line x1="200.0" y1="1045.5" x2="200.0" y2="1098.5" stroke="#555" stroke-width="2" marker-end="url(#av)"/>
<rect x="105.0" y="50.0" width="190" height="48" rx="24.0" ry="24.0" fill="#d7f0d2" stroke="#2e7d32" stroke-width="2"/>
<text x="200.0" y="79.0" font-size="15" fill="#222" text-anchor="middle">开始</text>
<rect x="50.0" y="471.5" width="300" height="54" rx="12" ry="12" fill="#fde9c8" stroke="#b5791f" stroke-width="2"/>
<text x="200.0" y="503.5" font-size="15" fill="#222" text-anchor="middle">① 输入10个字符 ch[]</text>
<rect x="50.0" y="575.5" width="300" height="54" rx="8" ry="8" fill="#eef3fb" stroke="#3a6ea5" stroke-width="2"/>
<text x="200.0" y="607.5" font-size="15" fill="#222" text-anchor="middle">② 外层循环 i=0..len-2</text>
<rect x="50.0" y="679.5" width="300" height="54" rx="8" ry="8" fill="#eef3fb" stroke="#3a6ea5" stroke-width="2"/>
<text x="200.0" y="711.5" font-size="15" fill="#222" text-anchor="middle">③ 内层循环 j=0..len-i-2</text>
<polygon points="200.0,762.5 315.0,810.5 200.0,858.5 85.0,810.5" fill="#e8f0fe" stroke="#1a56b0" stroke-width="2"/>
<text x="200.0" y="815.5" font-size="15" fill="#16335c" text-anchor="middle">④ arr[j]&lt;arr[j+1] ?</text>
<rect x="50.0" y="887.5" width="300" height="54" rx="8" ry="8" fill="#eef3fb" stroke="#3a6ea5" stroke-width="2"/>
<text x="200.0" y="919.5" font-size="15" fill="#222" text-anchor="middle">⑤ 交换 arr[j] 与 arr[j+1]</text>
<rect x="50.0" y="991.5" width="300" height="54" rx="12" ry="12" fill="#fde9c8" stroke="#b5791f" stroke-width="2"/>
<text x="200.0" y="1023.5" font-size="15" fill="#222" text-anchor="middle">⑥ 输出从大到小排序结果</text>
<rect x="105.0" y="1098.5" width="190" height="48" rx="24.0" ry="24.0" fill="#d7f0d2" stroke="#2e7d32" stroke-width="2"/>
<text x="200.0" y="1127.5" font-size="15" fill="#222" text-anchor="middle">结束</text>
<rect x="632" y="42" width="436" height="614" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/>
<text x="640" y="65.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">#include &lt;stdio.h&gt;</text>
<text x="640" y="88.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">void bubble(char arr[], int len) {</text>
<text x="640" y="111.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">    int i, j, temp;</text>
<text x="640" y="134.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#888888" font-weight="bold">    /* ② 外层循环 */</text>
<text x="640" y="157.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">    for (i = 0; i &lt; len - 1; i++) {</text>
<text x="640" y="180.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#888888" font-weight="bold">        /* ③ 内层循环 */</text>
<text x="640" y="203.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">        for (j = 0; j &lt; len - 1 - i; j++) {</text>
<text x="640" y="226.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#888888" font-weight="bold">            /* ④ 相邻比较 */</text>
<text x="640" y="249.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">            if (arr[j] &lt; arr[j + 1]) {</text>
<text x="640" y="272.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#888888" font-weight="bold">                /* ⑤ 交换 */</text>
<text x="640" y="295.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">                temp = arr[j];</text>
<text x="640" y="318.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">                arr[j] = arr[j + 1];</text>
<text x="640" y="341.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">                arr[j + 1] = temp;</text>
<text x="640" y="364.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">            }</text>
<text x="640" y="387.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">        }</text>
<text x="640" y="410.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">    }</text>
<text x="640" y="433.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">}</text>
<text x="640" y="456.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">int main() {</text>
<text x="640" y="479.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">    char ch[11]; int len = 10;</text>
<text x="640" y="502.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#888888" font-weight="bold">    /* ① 输入10个字符 */</text>
<text x="640" y="525.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">    printf("请输入10个字符："); scanf("%s", ch);</text>
<text x="640" y="548.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">    bubble(ch, len);</text>
<text x="640" y="571.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#888888" font-weight="bold">    /* ⑥ 输出排序结果 */</text>
<text x="640" y="594.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">    printf("从大到小排序：%s\n", ch);</text>
<text x="640" y="617.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">    return 0;</text>
<text x="640" y="640.5" font-family="Consolas,'Microsoft YaHei',monospace" font-size="13" fill="#1a1a1a" font-weight="normal">}</text>
