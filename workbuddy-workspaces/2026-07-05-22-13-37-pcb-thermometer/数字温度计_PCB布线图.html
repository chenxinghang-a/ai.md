        }

            font-size: 13px;

            height: 36px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
        }

            background: #e8f4fd;
            border-color: #2980b9;
            color: #2980b9;
        }

            width: 1px;
            height: 28px;
            background: #ddd;
            margin: 0 4px;
        }

        .toolbar .zoom-level {
            font-size: 12px;
            color: #666;
            min-width: 44px;
            text-align: center;
        }

        .canvas-container {

            transition: transform 0.25s ease;
            margin: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            border-radius: 4px;
            overflow: hidden;
            background: white;

        }

            left: 20px;

            border-bottom: 1px solid #eee;

            align-items: center;

            height: 16px;
            border: 1px solid #aaa;

        {id:"TR_045",net:"M-_OUT",layer:"B",from:{x:16,y:17},to:{x:1,y:14},via_points:[{x:28,y:17},{x:28,y:14},{x:1,y:14}],desc:"U4-OUT→M-(T5)"},
        {id:"TR_046",net:"M-_OUT",layer:"B",from:{x:16,y:17},to:{x:19,y:19},via_points:[{x:17,y:17},{x:17,y:19},{x:19,y:19}],desc:"U4-OUT→R6"},
        {id:"TR_047",net:"Node_G7",layer:"B",from:{x:21,y:19},to:{x:21,y:20},via_points:[],desc:"Node_G7→R7"},
        {id:"TR_048",net:"Node_G7",layer:"B",from:{x:21,y:20},to:{x:22,y:20},via_points:[],desc:"Node_G7→C7"},
        {id:"TR_049",net:"Node_G7",layer:"B",from:{x:21,y:20},to:{x:27,y:19},via_points:[{x:24,y:20},{x:24,y:19},{x:27,y:19}],desc:"Node_G7→W2-Wiper"},
        {id:"TR_050",net:"M-_OUT",layer:"B",from:{x:25,y:19},to:{x:26,y:17},via_points:[{x:26,y:19},{x:26,y:17}],desc:"W2→M-_OUT线"}
    ],

    jumpers: [
        { id:"JMP_001", net:"RESERVED", layer:"A", from:{x:0,y:0}, to:{x:0,y:0}, active:false }
    ]
};

// ==================== 绘制常量 ====================
const COLS = pcbData.grid.cols;       // 30
const ROWS = pcbData.grid.rows;       // 24
const CELL_SIZE = 24;                 // 每格像素
const PADDING = 40;                   // 边距

// ==================== 坐标转换函数 ====================
function gridToCanvas(gx, gy) {
    return {
        x: gx * CELL_SIZE + PADDING + CELL_SIZE / 2,
        y: gy * CELL_SIZE + PADDING + CELL_SIZE / 2
    };
}

function gridToCanvasTopLeft(gx, gy) {
    return {
        x: gx * CELL_SIZE + PADDING,
        y: gy * CELL_SIZE + PADDING
    };
}

// ==================== 获取元件颜色配置 ====================
function getComponentStyle(type) {
    const styles = {
        opamp:           { fill: '#FFE066', stroke: '#CC9900', textColor: '#333' },
        sensor:          { fill: '#B4D7E8', stroke: '#6BA3BD', textColor: '#333' },
        voltage_reference:{ fill: '#F5D76E', stroke: '#C9A83C', textColor: '#333' },
        resistor:        { fill: '#90EE90', stroke: '#3DA33D', textColor: '#333' },
        capacitor:       { fill: '#87CEFA', stroke: '#4682B4', textColor: '#333' },
        potentiometer:   { fill: '#FFB347', stroke: '#CC7A00', textColor: '#333' }
    };
    return styles[type] || { fill: '#EEE', stroke: '#AAA', textColor: '#333' };
}

function getPinColor(net) {
    if (!net) return '#666666';
    const n = String(net).toUpperCase();
    if (n.includes('12V') || n === '+12V') return '#E74C3C';
    if (n === '-12V' || n.includes('-12')) return '#3498DB';
    if (n === 'GND') return '#333333';
    return '#666666';
}

// ==================== 初始化 Canvas ====================
const canvas = document.getElementById('pcbCanvas');
const ctx = canvas.getContext('2d');
const W = COLS * CELL_SIZE + 2 * PADDING;
const H = ROWS * CELL_SIZE + 2 * PADDING;
canvas.width = W;
canvas.height = H;

let currentZoom = 1;

// ==================== 绘制函数 ====================

/** 1. 网格系统 */
function drawGrid() {
    for (let gx = 0; gx <= COLS; gx++) {
        for (let gy = 0; gy <= ROWS; gy++) {
            const tl = gridToCanvasTopLeft(gx, gy);
            const isMajorX = (gx % 5 === 0);
            const isMajorY = (gy % 5 === 0);
            const isMajor = isMajorX || isMajorY;
            ctx.strokeStyle = isMajor ? '#BBBBBB' : '#DDDDDD';
            ctx.lineWidth = isMajor ? 1 : 0.5;
            ctx.strokeRect(tl.x, tl.y, CELL_SIZE, CELL_SIZE);
        }
    }
    // 坐标标注
    ctx.font = '9px Arial';
    ctx.fillStyle = '#999';
    ctx.textAlign = 'center';
    for (let gx = 1; gx <= COLS; gx++) {
        if (gx % 5 === 0) {
            const pos = gridToCanvas(gx, 0);
            ctx.fillText(String(gx), pos.x, PADDING - 8);
        }
    }
    ctx.textAlign = 'right';
    for (let gy = 1; gy <= ROWS; gy++) {
        if (gy % 5 === 0) {
            const pos = gridToCanvas(0, gy);
            ctx.fillText(String(gy), PADDING - 6, pos.y + 3);
        }
    }
}

/** 2. 区域分隔标注 */
function drawZoneLabels() {
    ctx.save();
    ctx.font = 'bold 13px Arial';
    ctx.fillStyle = 'rgba(52,73,94,0.08)';
    ctx.textAlign = 'center';

    // 上半部区域背景文字
    ctx.font = 'bold 40px Arial';
    ctx.fillText('温度检测通道', W / 2, ROWS * 0.25 * CELL_SIZE + PADDING);

    // 下半部区域背景文字
    ctx.fillText('基准校正通道', W / 2, ROWS * 0.72 * CELL_SIZE + PADDING);

    // Y=13 分隔线标注
    ctx.restore();
    ctx.strokeStyle = 'rgba(52,152,219,0.3)';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([4, 4]);
    const midY = gridToCanvas(0, 12.5).y;
    ctx.beginPath();
    ctx.moveTo(PADDING, midY);
    ctx.lineTo(W - PADDING, midY);
    ctx.stroke();
    ctx.setLineDash([]);
}

/** 3. 电源轨 */
function drawPowerRails() {
    pcbData.power_rails.forEach(rail => {
        const p0 = gridToCanvas(rail.path[0].x, rail.path[0].y);
        const p1 = gridToCanvas(rail.path[1].x, rail.path[1].y);
        ctx.strokeStyle = rail.color;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();

        // 左侧标注
        ctx.save();
        ctx.font = 'bold 11px Arial';
        ctx.fillStyle = rail.color;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        let label = rail.net;
        if (label === '+12V') label = '+12V';
        else if (label === '-12V') label = '−12V';
        else if (label === 'GND') label = '⏚ GND';
        ctx.fillText(label, PADDING - 6, p0.y);
        ctx.restore();
    });
}

/** 4. B面走线 */
function drawTraces() {
    ctx.lineCap = 'square';
    ctx.lineJoin = 'miter';
    ctx.strokeStyle = '#2980B9';
    ctx.lineWidth = 2.5;

    pcbData.traces.forEach(trace => {
        ctx.beginPath();
        const start = gridToCanvas(trace.from.x, trace.from.y);
        ctx.moveTo(start.x, start.y);
        if (trace.via_points && trace.via_points.length > 0) {
            trace.via_points.forEach(vp => {
                const pt = gridToCanvas(vp.x, vp.y);
                ctx.lineTo(pt.x, pt.y);
            });
        }
        const end = gridToCanvas(trace.to.x, trace.to.y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();
    });
}

/** 5. A面飞线 */
function drawJumpers() {
    ctx.strokeStyle = '#E74C3C';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 3]);
    ctx.lineCap = 'round';

    pcbData.jumpers.forEach(jmp => {
        if (jmp.active && jmp.from.x !== 0) {
            ctx.beginPath();
            const s = gridToCanvas(jmp.from.x, jmp.from.y);
            const e = gridToCanvas(jmp.to.x, jmp.to.y);
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(e.x, e.y);
            ctx.stroke();
        }
    });
    ctx.setLineDash([]);
}

/** 6. 元件绘制 */
function drawComponents() {
    pcbData.components.forEach(comp => {
        const style = getComponentStyle(comp.type);
        const tl = gridToCanvasTopLeft(comp.x, comp.y);
        const wPx = comp.width * CELL_SIZE;
        const hPx = comp.height * CELL_SIZE;
        const cx = tl.x + wPx / 2;
        const cy = tl.y + hPx / 2;

        ctx.save();

        if (comp.type === 'opamp') {
            // DIP-8 大矩形
            ctx.fillStyle = style.fill;
            ctx.strokeStyle = style.stroke;
            ctx.lineWidth = 1.5;
            roundRect(ctx, tl.x, tl.y, wPx, hPx, 3);
            ctx.fill();
            ctx.stroke();
            // 缺口标记（顶部居中）
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(cx, tl.y + 5, 4, 0, Math.PI * 2);
            ctx.fill();
            // 内部名称
            ctx.fillStyle = style.textColor;
            ctx.font = 'bold 11px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const lines = comp.name.split('\n');
            lines.forEach((line, i) => {
                ctx.fillText(line, cx, cy - 4 + i * 14);
            });
            // 引脚编号
            ctx.font = '9px Arial';
            ctx.fillStyle = '#666';
            const pins = comp.pin_positions;
            // 左侧 1-4 (从上到下)
            [1,2,3,4].forEach((pn, idx) => {
                if (pins[pn]) {
                    const pp = gridToCanvas(pins[pn].x, pins[pn].y);
                    ctx.textAlign = 'right';
                    ctx.fillText(String(pn), tl.x - 3, pp.y + 3);
                }
            });
            // 右侧 8-7-6-5 (从上到下)
            [8,7,6,5].forEach((pn, idx) => {
                if (pins[pn]) {
                    const pp = gridToCanvas(pins[pn].x, pins[pn].y);
                    ctx.textAlign = 'left';
                    ctx.fillText(String(pn), tl.x + wPx + 3, pp.y + 3);
                }
            });

        } else if (comp.type === 'sensor') {
            // AD590 椭圆/圆形
            ctx.fillStyle = style.fill;
            ctx.strokeStyle = style.stroke;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(cx, cy, wPx / 2 - 1, hPx / 2 - 1, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = style.textColor;
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(comp.name, cx, cy);

        } else if (comp.type === 'voltage_reference') {
            // MC1403 方块
            ctx.fillStyle = style.fill;
            ctx.strokeStyle = style.stroke;
            ctx.lineWidth = 1.5;
            roundRect(ctx, tl.x, tl.y, wPx, hPx, 3);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = style.textColor;
            ctx.font = 'bold 9px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const vlines = comp.name.split('\n');
            vlines.forEach((l, i) => {
                ctx.fillText(l, cx, cy - 5 + i * 12);
            });

        } else {
            // 通用：电阻、电容、电位器 — 矩形
            ctx.fillStyle = style.fill;
            ctx.strokeStyle = style.stroke;
            ctx.lineWidth = 1.2;
            roundRect(ctx, tl.x, tl.y, wPx, hPx, 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = style.textColor;
            // 根据大小调整字体
            const fontSize = (wPx >= CELL_SIZE * 2 && hPx >= CELL_SIZE) ? 10 : 8;
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(comp.name, cx, cy - (comp.value ? 5 : 0));
            if (comp.value) {
                ctx.font = `${fontSize - 1}px Arial`;
                ctx.fillText(comp.value, cx, cy + (fontSize - 1) + 2);
            }
        }

        ctx.restore();
    });
}

/** 7. 端子绘制 */
function drawTerminals() {
    pcbData.terminals.forEach(term => {
        const pos = gridToCanvas(term.x, term.y);
        ctx.save();
        ctx.fillStyle = '#DDD';
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // 名称
        ctx.fillStyle = '#333';
        ctx.font = 'bold 9px Arial';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        const shortName = term.name.length > 6 ? term.name.substring(0, 6) : term.name;
        ctx.fillText(shortName, pos.x + 12, pos.y);
        ctx.restore();
    });
}

/** 8. 引脚焊盘点 */
function drawPins() {
    pcbData.components.forEach(comp => {
        if (comp.pin_positions) {
            Object.entries(comp.pin_positions).forEach(([pinNum, pInfo]) => {
                const pos = gridToCanvas(pInfo.x, pInfo.y);
                const color = getPinColor(pInfo.net);
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#FFF';
                ctx.lineWidth = 0.8;
                ctx.stroke();
            });
        }
        // 两引脚元件 (pin1/pin2)
        if (comp.pin1) {
            const p = gridToCanvas(comp.pin1.x, comp.pin1.y);
            const c = getPinColor(comp.pin1.net);
            ctx.fillStyle = c;
            ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#FFF'; ctx.lineWidth = 0.8; ctx.stroke();
        }
        if (comp.pin2) {
            const p = gridToCanvas(comp.pin2.x, comp.pin2.y);
            const c = getPinColor(comp.pin2.net);
            ctx.fillStyle = c;
            ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#FFF'; ctx.lineWidth = 0.8; ctx.stroke();
        }
        // 电位器三引脚
        if (comp.pin3) {
            const p = gridToCanvas(comp.pin3.x, comp.pin3.y);
            const c = getPinColor(comp.pin3.net);
            ctx.fillStyle = c;
            ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#FFF'; ctx.lineWidth = 0.8; ctx.stroke();
        }
    });
}

/** 圆角矩形辅助函数 */
function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

/** 9. 标题与统计信息 */
function drawTitleAndStats() {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(W - 180, H - 95, 175, 88);
    ctx.strokeStyle = '#CCC';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(W - 180, H - 95, 175, 88);

    ctx.font = 'bold 11px Arial';
    ctx.fillStyle = '#2c3e50';
    ctx.textAlign = 'left';
    ctx.fillText('设计信息', W - 172, H - 78);

    ctx.font = '9px Arial';
    ctx.fillStyle = '#555';
    const stats = [
        '网格: 30 × 24 | 双面 PCB',
        '元件: 27 个',
        'B面走线: 50 条',
        '电源轨: 3 条 (+12V / −12V / GND)',
        '飞线: 0 条 (预留 1)',
        '版本: v1.0 | 2026-07-05'
    ];
    stats.forEach((s, i) => {
        ctx.fillText(s, W - 172, H - 63 + i * 12);
    });
    ctx.restore();
}

// ==================== 主绘制流程 ====================
function render() {
    ctx.clearRect(0, 0, W, H);
    // 白色底
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, W, H);

    // 按层级顺序绘制
    drawGrid();          // 1. 网格
    drawZoneLabels();    // 2. 区域标注
    drawPowerRails();    // 3. 电源轨
    drawTraces();        // 4. B面走线
    drawJumpers();       // 5. A面飞线
    drawComponents();    // 6. 元件
    drawTerminals();     // 7. 端子
    drawPins();          // 8. 引脚焊盘
    drawTitleAndStats(); // 9. 标题统计
}

// ==================== 缩放控制 ====================
function adjustZoom(delta) {
    currentZoom = Math.max(0.25, Math.min(4, currentZoom + delta));
    applyZoom();
}
function resetZoom() {
    currentZoom = 1;
    applyZoom();
}
function applyZoom() {
    const container = document.getElementById('canvasContainer');
    container.style.transform = `scale(${currentZoom})`;
    document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
}

// ==================== 启动渲染 ====================
render();

// 初始适应屏幕
(function fitInitial() {
    const availW = window.innerWidth - 60;
    const availH = window.innerHeight - 120;
    const scaleW = availW / W;
    const scaleH = availH / H;
    currentZoom = Math.min(scaleW, scaleH, 1);
    if (currentZoom < 0.5) currentZoom = 0.5;
    applyZoom();
})();
</script>
